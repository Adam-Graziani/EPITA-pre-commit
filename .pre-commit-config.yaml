repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.2.0
    hooks:
      - id: end-of-file-fixer
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        types_or: [c]
  - repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.4.0
    hooks:
      - id: clang-tidy
        args:
          - "--config-file=.clang-tidy-epita"
